configuration:
  port:
    name: Port
    description: >-
      Port, na kterém poslouchá lokální Icecast stream (odsud si ho LARA stáhne).
      Adresa je http://<IP-HA>:<port>/default.
  source_password:
    name: Heslo zdroje (interní)
    description: >-
      Interní heslo Icecastu, kterým Liquidsoap publikuje stream, a heslo do
      Icecast admin stránky. LARA ho NEPOTŘEBUJE. Klidně nech výchozí.
  bitrate:
    name: Výstupní bitrate (kbps)
    description: Bitrate MP3 streamu posílaného do LARA, v kbps (např. 128, 192, 320).
  spotify_bitrate:
    name: Kvalita Spotify (kbps)
    description: >-
      Kvalita streamu ze Spotify Connect (librespot): 96, 160 nebo 320 kbps.
      Vyžaduje Spotify Premium účet.
  zone_name:
    name: Název Spotify zařízení
    description: >-
      Jméno, pod kterým se addon objeví v aplikaci Spotify jako Connect zařízení
      (= název audio zóny). Pustíš do něj hudbu a addon ji přepošle do LARA rádií.
  zone_volume:
    name: Hlasitost zóny (%)
    description: >-
      Hlasitost, na kterou se LARA nastaví při zapnutí audio zóny (0–100).
      Hlasitost jde pak měnit i přímo na LAŘE.
  idle_timeout:
    name: Prodleva vypnutí (s)
    description: >-
      Kolik sekund musí být Spotify v klidu (pauza/stop), než se LARA vypne a
      opustí audio zónu. Krátká pauza nebo přechod mezi skladbami ji tedy nevypne.
  control_mode:
    name: Ovládání LARA
    description: >-
      slimproto = addon je Slim server (SlimProto :3483 + LMS CLI) a přepíná LARA
      do audio zóny, když hraje Spotify (výchozí). off = jen najít LARA rádia a
      vypsat je do logu, nic nepřepínat (pro testování).
  cli_port:
    name: LMS CLI port
    description: >-
      Port, na kterém addon poslouchá textové LMS CLI — tudy si LARA říká, co hraje,
      a posílá stisky vlastních tlačítek. Musí sedět s „CLI port" v konfiguraci
      audio zóny v LAŘE (výchozí 9595).
  cli_username:
    name: LMS CLI — uživatel
    description: >-
      Jméno, kterým se LARA hlásí na CLI. Nech prázdné, pokud v LAŘE žádné není.
  cli_password:
    name: LMS CLI — heslo
    description: >-
      Heslo, kterým se LARA hlásí na CLI. Nech prázdné, pokud v LAŘE žádné není.
  lara_off_action:
    name: Co udělat při vypnutí zóny
    description: >-
      slim = zastavit stream a ztlumit výstupy přes SlimProto (výchozí).
      slim_elko = navíc poslat LAŘE stop přes ELKO protokol na portu 61695.
      none = nedělat nic, LARA zůstane v audio zóně.
  lara_username:
    name: LARA — uživatel
    description: Přihlašovací jméno k LARA rádiím (výchozí „admin").
  lara_password:
    name: LARA — heslo
    description: Heslo k LARA rádiím (výchozí „elkoep").
  lara_hosts:
    name: LARA — ruční IP
    description: >-
      Volitelný seznam IP adres LARA rádií pro případ, že je automatické hledání
      (UDP broadcast) nenajde — např. v jiné podsíti.
