configuration:
  port:
    name: Port
    description: >-
      Port, na kterém poslouchá lokální Icecast stream (odsud si ho LARA stáhne).
      Adresa je http://<IP-HA>:<port>/default.
  source_password:
    name: Heslo zdroje (interní)
    description: >-
      Interní heslo Icecastu, kterým Liquidsoap publikuje stream, a heslo do
      Icecast admin stránky. LARA ho NEPOTŘEBUJE. Klidně nech výchozí.
  bitrate:
    name: Výstupní bitrate (kbps)
    description: Bitrate MP3 streamu posílaného do LARA, v kbps (např. 128, 192, 320).
  spotify_bitrate:
    name: Kvalita Spotify (kbps)
    description: >-
      Kvalita streamu ze Spotify Connect (librespot): 96, 160 nebo 320 kbps.
      Vyžaduje Spotify Premium účet.
  spotify_remote_access:
    name: Přístup ke Spotify zvenčí sítě
    description: >-
      VYPNUTO (doporučeno): zóny se nabízejí všem na tvé Wi-Fi a nikomu mimo ni a žádné
      přihlášení ke Spotify se neukládá. Dřív uložené přihlášení se při startu addonu smaže —
      tímhle přepínačem tedy zároveň uvolníš účet z téhle krabice, což se hodí poté, co systém
      někdo nastavoval ze svého telefonu. ZAPNUTO: účet, který jako poslední zónu vybral,
      zůstane přihlášený, takže ji ten jeden člověk vidí i mimo domov a dá se řídit integrací
      Spotify v Home Assistantu; ostatní na Wi-Fi ji vidí dál taky. Pozor, ZAPNUTO neznamená
      vlastnictví — zónu může kdokoli v síti převzít a tím se uložené přihlášení přepíše jeho.
  zone_name:
    name: Náhradní název zařízení
    description: >-
      Použije se jen tehdy, když addon při startu nenajde v síti žádné LARA rádio — pak
      vytvoří jedno takto pojmenované Spotify zařízení, které bude řídit rádio, jež se
      připojí později. Když se rádia najdou, zařízení se jmenují podle nich.
  group_name:
    name: Název skupinového zařízení
    description: >-
      Jméno Spotify zařízení, které hraje do všech rádií najednou. Objeví se, jen když
      jsou nalezena aspoň dvě rádia — u jednoho by to byl jen druhý název pro totéž.
  lara_name_prefix:
    name: Přidat před názvy „LARA"
    description: >-
      Zapnuto: zařízení se ve Spotify jmenují „LARA Obývák", „LARA Kuchyň" — drží v seznamu
      pohromadě a je jasné, co to je. Vypnuto: použije se jméno rádia tak, jak je nastavené
      v LAŘE. Rádia, která už „LARA" ve jméně mají, se nepředsazují dvakrát.
  scan_subnet:
    name: Podsíť k prohledání
    description: >-
      Nech prázdné a addon prohledá podsíť, ve které sám je. Vyplň jen tehdy, když jsou
      rádia jinde — první tři čísla adresy, např. „10.0.0".
  zone_volume:
    name: Výchozí hlasitost zóny (%)
    description: >-
      Hlasitost, kterou addon pošle rádiu při zapnutí zóny. Pozor: na firmwaru 3.7.001 se
      zdá, že se na výstupu neprojeví — hlasitost se reálně ovládá posuvníkem v aplikaci
      Spotify. 0 = nastavení hlasitosti rádiu vůbec neposílat.
  buffer_seconds:
    name: Náskok bufferu (s)
    description: >-
      Kolik sekund zvuku si LARA načte, než začne hrát. Tohle je hlavní zdroj zpoždění
      mezi Spotify a reproduktorem — nižší hodnota = svižnější reakce, ale při zakolísání
      sítě může zvuk vypadávat. 1.5 s je bezpečný kompromis, pod 0.8 s to už bývá riskantní.
  idle_timeout:
    name: Prodleva vypnutí (s)
    description: >-
      Kolik sekund musí být Spotify v klidu (pauza/stop), než LARA opustí audio zónu a vrátí
      se na seznam rádií. Tohle je ta prodleva, po kterou zóna po zastavení hudby ještě visí
      na displeji. Přechod mezi skladbami ji nevypne — ten se jako pauza nepočítá.
  control_mode:
    name: Ovládání LARA
    description: >-
      slimproto = addon je Slim server (SlimProto :3483 + LMS CLI) a přepíná LARA
      do audio zóny, když hraje Spotify (výchozí). off = jen najít LARA rádia a
      vypsat je do logu, nic nepřepínat (pro testování).
  cli_port:
    name: LMS CLI port
    description: >-
      Port, na kterém addon poslouchá textové LMS CLI — tudy si LARA říká, co hraje,
      a posílá stisky vlastních tlačítek. Musí sedět s „CLI port" v konfiguraci
      audio zóny v LAŘE (výchozí 9595).
  cli_username:
    name: LMS CLI — uživatel
    description: >-
      Jméno, kterým se LARA hlásí na CLI. Nech prázdné, pokud v LAŘE žádné není.
  cli_password:
    name: LMS CLI — heslo
    description: >-
      Heslo, kterým se LARA hlásí na CLI. Nech prázdné, pokud v LAŘE žádné není.
  lara_username:
    name: LARA — uživatel
    description: >-
      Přihlašovací jméno k LARA rádiím (výchozí „admin"). Potřebné pro návrat na seznam rádií
      po skončení Spotify — ten jde po portu 61695, který ověřování vyžaduje.
  lara_password:
    name: LARA — heslo
    description: Heslo k LARA rádiím (výchozí „elkoep"). Viz uživatel výše.
  lara_hosts:
    name: LARA — ruční IP
    description: >-
      Volitelný seznam IP adres LARA rádií pro případ, že je automatické hledání
      (UDP broadcast) nenajde — např. v jiné podsíti.
