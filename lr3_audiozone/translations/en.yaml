configuration:
  port:
    name: Port
    description: >-
      Port the local Icecast stream listens on (LARA fetches audio from here).
      The address is http://<HA-IP>:<port>/default.
  source_password:
    name: Source password (internal)
    description: >-
      Internal Icecast password Liquidsoap uses to publish the stream, and the
      Icecast admin password. LARA does NOT need it. You can leave the default.
  bitrate:
    name: Output bitrate (kbps)
    description: Bitrate of the MP3 stream sent to LARA, in kbps (e.g. 128, 192, 320).
  spotify_bitrate:
    name: Spotify quality (kbps)
    description: >-
      Spotify Connect (librespot) streaming quality: 96, 160 or 320 kbps.
      Requires a Spotify Premium account.
  zone_name:
    name: Spotify device name
    description: >-
      The name the add-on shows in the Spotify app as a Connect device (= the
      audio-zone name). Play to it and the add-on pushes the audio to the LARA radios.
  zone_volume:
    name: Default zone volume (%)
    description: >-
      Volume the LARA is set to when the zone switches on, until you move the slider in the
      Spotify app - from then on that slider drives the LARA's volume directly (the stream
      itself is never attenuated, so there is no hidden second volume control).
      0 = never touch the LARA's volume.
  buffer_seconds:
    name: Buffer lead (s)
    description: >-
      Seconds of audio the LARA loads before it starts playing. This is the main source of
      delay between Spotify and the speaker - lower is snappier but a network hiccup can cause
      dropouts. 1.5 s is a safe compromise; below 0.8 s tends to get risky.
  idle_timeout:
    name: Power-off delay (s)
    description: >-
      How many seconds Spotify has to stay idle (paused/stopped) before the LARA is
      powered off and leaves the audio zone. Short pauses and track changes do not
      switch it off.
  control_mode:
    name: LARA control
    description: >-
      slimproto = the add-on is a Slim server (SlimProto :3483 + LMS CLI) and switches
      the LARA into the audio zone whenever Spotify plays (default). off = only discover
      LARA radios and log them, never switch (for testing).
  cli_port:
    name: LMS CLI port
    description: >-
      Port the add-on serves the text LMS CLI on — the LARA uses it to learn what is
      playing and to send its own button presses. Must match the "CLI port" in the
      LARA's audio-zone configuration (9595 by default).
  cli_username:
    name: LMS CLI username
    description: Username the LARA logs in with on the CLI. Leave empty if the LARA has none.
  cli_password:
    name: LMS CLI password
    description: Password the LARA logs in with on the CLI. Leave empty if the LARA has none.
  lara_off_action:
    name: Zone power-off action
    description: >-
      radio = stop the stream and send the LARA back to its station list, stopped - ready for
      whoever walks up to it (default; needs the correct LARA username/password, it goes over
      port 61695). slim = only stop the stream and mute the outputs over SlimProto, which
      leaves the unit lit showing an empty audio zone. slim_elko = slim plus an ELKO stop.
      none = do nothing, leave the LARA sitting in the audio zone.
  lara_username:
    name: LARA username
    description: Login name for the LARA radios (default "admin").
  lara_password:
    name: LARA password
    description: Password for the LARA radios (default "elkoep").
  lara_hosts:
    name: LARA manual IPs
    description: >-
      Optional list of LARA IP addresses for when auto-discovery (UDP broadcast)
      cannot find them — e.g. on a different subnet.
