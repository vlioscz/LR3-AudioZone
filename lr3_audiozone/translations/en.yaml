configuration:
  port:
    name: Port
    description: >-
      Port the local Icecast stream listens on (LARA fetches audio from here).
      The address is http://<HA-IP>:<port>/default.
  source_password:
    name: Source password (internal)
    description: >-
      Internal Icecast password Liquidsoap uses to publish the stream, and the
      Icecast admin password. LARA does NOT need it. You can leave the default.
  bitrate:
    name: Output bitrate (kbps)
    description: Bitrate of the MP3 stream sent to LARA, in kbps (e.g. 128, 192, 320).
  spotify_bitrate:
    name: Spotify quality (kbps)
    description: >-
      Spotify Connect (librespot) streaming quality: 96, 160 or 320 kbps.
      Requires a Spotify Premium account.
  spotify_remote_access:
    name: Spotify access from outside the network
    description: >-
      OFF (recommended): the zones are offered to everyone on your Wi-Fi and to nobody outside
      it, and no Spotify login is kept. Any login stored earlier is deleted when the add-on
      starts, so this switch is also how you release an account from this box - useful after
      someone has set the system up with their own phone. ON: the last account to select a
      zone stays logged in, so that one person also sees it away from home and it can be
      driven by the Home Assistant Spotify integration; everyone else on the Wi-Fi still
      sees it too. Note that ON is not ownership - anyone on the network can take a zone
      over, and doing so replaces the stored login with theirs.
  zone_name:
    name: Fallback device name
    description: >-
      Only used when the add-on finds no LARA on the network at start-up: it then offers a
      single device under this name, which will drive whichever radio connects later. When
      radios are found, the devices are named after them instead.
  group_name:
    name: Group device name
    description: >-
      Name of the Spotify device that plays to every radio at once. It only appears when at
      least two radios are found - with one it would just be a second name for the same speaker.
  lara_name_prefix:
    name: Prefix names with "LARA"
    description: >-
      On: devices appear in Spotify as "LARA Living room", "LARA Kitchen" - they stay together
      in the list and it is obvious what they are. Off: the radio's own configured name is used
      as-is. Radios whose name already starts with "LARA" are never prefixed twice.
  scan_subnet:
    name: Subnet to scan
    description: >-
      Leave empty and the add-on scans the subnet it is on. Set it only if the radios live
      elsewhere - the first three numbers of the address, e.g. "10.0.0".
  zone_volume:
    name: Default zone volume (%)
    description: >-
      Volume the add-on sends to the radio when the zone switches on. Note: on firmware 3.7.001
      this appears to have no effect on the output - volume is really controlled with the slider
      in the Spotify app. 0 = never send a volume to the radio at all.
  buffer_seconds:
    name: Buffer lead (s)
    description: >-
      Seconds of audio the LARA loads before it starts playing. This is the main source of
      delay between Spotify and the speaker - lower is snappier but a network hiccup can cause
      dropouts. 1.5 s is a safe compromise; below 0.8 s tends to get risky.
  idle_timeout:
    name: Power-off delay (s)
    description: >-
      How many seconds Spotify has to stay idle (paused/stopped) before the LARA leaves the
      audio zone and returns to its station list. This is the delay for which the zone stays
      on the display after the music stops. Track changes do not count as a pause.
  control_mode:
    name: LARA control
    description: >-
      slimproto = the add-on is a Slim server (SlimProto :3483 + LMS CLI) and switches
      the LARA into the audio zone whenever Spotify plays (default). off = only discover
      LARA radios and log them, never switch (for testing).
  park_on_zone_off:
    name: Return the radio to its station list (port 61695)
    description: >-
      OFF (recommended): when the music stops, the add-on only stops and mutes the stream over
      SlimProto. The radio keeps showing the audio zone until somebody touches it - untidy, but
      nothing is written to the radio's configuration port. ON: the add-on additionally switches
      the source back to the station list over port 61695, which needs the LARA username and
      password. That switch is the one thing this add-on does that no Logitech server does, and
      it appeared in the sequence before two radios at a customer's site locked up hard enough
      to need the mains pulled. Leave it off unless you know your radios cope.
  cli_port:
    name: LMS CLI port
    description: >-
      Port the add-on serves the text LMS CLI on — the LARA uses it to learn what is
      playing and to send its own button presses. Must match the "CLI port" in the
      LARA's audio-zone configuration (9595 by default).
  cli_username:
    name: LMS CLI username
    description: Username the LARA logs in with on the CLI. Leave empty if the LARA has none.
  cli_password:
    name: LMS CLI password
    description: Password the LARA logs in with on the CLI. Leave empty if the LARA has none.
  lara_username:
    name: LARA username
    description: >-
      Login name for the LARA radios (default "admin"). Needed for the switch back to the
      station list when Spotify stops - that goes over port 61695, which requires auth.
  lara_password:
    name: LARA password
    description: Password for the LARA radios (default "elkoep"). See the username above.
  lara_hosts:
    name: LARA manual IPs
    description: >-
      Optional list of LARA IP addresses for when auto-discovery (UDP broadcast)
      cannot find them — e.g. on a different subnet.
