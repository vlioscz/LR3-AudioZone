name: LR3 AudioZone
slug: lr3_audiozone
version: "0.2.2"
description: Spotify Connect → automatické přehrání na ELKO EP „LARA" přes Slim server (SlimProto + LMS CLI)
url: https://github.com/vlioscz/LR3-AudioZone
arch:
  - aarch64
  - amd64
startup: services
boot: auto
host_network: true
init: false

options:
  port: 8121
  source_password: "changeme"
  bitrate: 192
  spotify_bitrate: 320
  zone_name: "Audio zóna"
  zone_volume: 90
  buffer_seconds: 1.5
  idle_timeout: 8
  control_mode: "slimproto"
  cli_port: 9595
  cli_username: ""
  cli_password: ""
  lara_username: "admin"
  lara_password: "elkoep"
  lara_hosts: []

schema:
  port: int
  source_password: password
  bitrate: int
  spotify_bitrate: list(96|160|320)
  zone_name: str
  zone_volume: int(0,100)
  buffer_seconds: float(0.2,10)
  idle_timeout: int(0,3600)
  control_mode: list(off|slimproto)
  cli_port: int
  cli_username: str?
  cli_password: password?
  lara_username: str
  lara_password: password
  lara_hosts:
    - str
