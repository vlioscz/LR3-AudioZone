name: LR3 AudioZone
slug: lr3_audiozone
version: "0.3.6"
description: Spotify Connect → automatické přehrání na ELKO EP „LARA" přes Slim server (SlimProto + LMS CLI)
url: https://github.com/vlioscz/LR3-AudioZone
arch:
  - aarch64
  - amd64
startup: services
boot: auto
host_network: true
init: false

options:
  port: 8121
  source_password: "changeme"
  bitrate: 192
  spotify_bitrate: 320
  spotify_remote_access: false
  zone_name: "Audio zóna"
  group_name: "LARA All"
  lara_name_prefix: true
  scan_subnet: ""
  zone_volume: 90
  buffer_seconds: 2.7
  idle_timeout: 60
  control_mode: "slimproto"
  park_on_zone_off: false
  cli_port: 9595
  cli_username: ""
  cli_password: ""
  lara_username: "admin"
  lara_password: "elkoep"
  lara_hosts: []

schema:
  port: int
  source_password: password
  bitrate: int
  spotify_bitrate: list(96|160|320)
  spotify_remote_access: bool
  zone_name: str
  group_name: str
  lara_name_prefix: bool
  scan_subnet: str?
  zone_volume: int(0,100)
  buffer_seconds: float(0.2,10)
  idle_timeout: int(0,3600)
  control_mode: list(off|slimproto)
  park_on_zone_off: bool
  cli_port: int
  cli_username: str?
  cli_password: password?
  lara_username: str
  lara_password: password
  lara_hosts:
    - str
